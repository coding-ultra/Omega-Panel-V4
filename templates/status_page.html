<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Status</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111d30;--line:#26364b;--muted:#91a0b8;--text:#edf5ff;--green:#37e3a1;--red:#ff647c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#12314a,transparent 42%),var(--bg);font:15px system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
.wrap{width:min(760px,100%)}h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}.sub{color:var(--muted);margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:linear-gradient(145deg,#17263b,#0e1828);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 55px #0005}.label{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:700}.value{font-size:clamp(42px,8vw,64px);font-weight:800;margin-top:12px;line-height:1}.online{color:var(--green)}.offline{color:var(--red)}.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.4s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #37e3a166}70%{box-shadow:0 0 0 10px #37e3a100}100%{box-shadow:0 0 0 0 #37e3a100}}.foot{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
@media(max-width:480px){.grid{grid-template-columns:1fr}.card{padding:20px}}
</style></head>
<body><main class="wrap"><h1>System Status</h1><p class="sub">Live node availability. No node names, addresses, domains or infrastructure details are exposed.</p>
<section class="grid"><article class="card"><div class="label">Online nodes</div><div class="value online"><span class="pulse"></span>{{ online_nodes }}</div></article><article class="card"><div class="label">Offline nodes</div><div class="value offline">{{ offline_nodes }}</div></article></section>
<p class="foot">Auto refresh every 15 seconds</p></main><script>setTimeout(()=>location.reload(),15000)</script></body></html>
